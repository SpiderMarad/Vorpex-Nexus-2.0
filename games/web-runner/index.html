<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WEB RUNNER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');

  :root {
    --bg: #0a0d12;
    --bg2: #0e1420;
    --silk: #aab4c2;
    --venom: #7cff6b;
    --amber: #ffb340;
    --danger: #ff4d5e;
    --dim: #4b5563;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: 'Space Mono', monospace;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }

  canvas {
    background: radial-gradient(ellipse at 50% 20%, var(--bg2) 0%, var(--bg) 75%);
    display: block;
    touch-action: none;
    cursor: pointer;
    width: 100%;
    height: auto;
    -webkit-tap-highlight-color: transparent;
    border-radius: 4px;
  }

  #gameWrap {
    position: relative;
    width: min(420px, 92vw);
    max-height: 100%;
    line-height: 0;
  }

  #hud {
    position: absolute;
    top: 18px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    pointer-events: none;
    font-family: 'Space Mono', monospace;
    color: var(--silk);
    letter-spacing: 0.08em;
    font-size: 14px;
  }

  #hud .label { color: var(--dim); font-size: 10px; display: block; margin-bottom: 2px; }
  #hud .val { color: var(--venom); font-size: 20px; font-weight: 700; }
  #hud .right .val { color: var(--amber); }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--silk);
    background: rgba(10,13,18,0.72);
    backdrop-filter: blur(2px);
    transition: opacity 0.25s ease;
  }

  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 6vw, 46px);
    font-weight: 800;
    color: #f4f6f8;
    margin: 0 0 6px 0;
    letter-spacing: -0.02em;
  }

  #overlay .spidermark {
    font-size: 30px;
    display: inline-block;
    animation: dangle 2.4s ease-in-out infinite;
    transform-origin: top center;
  }

  @keyframes dangle {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(4deg) translateY(3px); }
  }

  #overlay p.sub {
    color: var(--dim);
    font-size: 13px;
    margin: 0 0 26px 0;
    letter-spacing: 0.05em;
  }

  #overlay .stat-row {
    display: flex;
    gap: 36px;
    margin-bottom: 28px;
  }

  #overlay .stat .n {
    font-size: 26px;
    font-weight: 700;
    color: var(--amber);
  }
  #overlay .stat .l {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }

  #startBtn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.12em;
    padding: 14px 34px;
    background: var(--venom);
    color: #0a0d12;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
  }
  #startBtn:hover { filter: brightness(1.08); }

  #controls-note {
    margin-top: 22px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.05em;
  }

  #gameover-label {
    color: var(--danger);
    font-size: 11px;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    display: none;
  }
</style>
</head>
<body>
<div id="stage">
 <div id="gameWrap">
  <div id="hud">
    <div class="left">
      <span class="label">SCORE</span>
      <span class="val" id="scoreVal">0</span>
    </div>
    <div class="right" style="text-align:right;">
      <span class="label">BEST</span>
      <span class="val" id="bestVal">0</span>
    </div>
  </div>

  <canvas id="game" width="420" height="700"></canvas>

  <div id="overlay">
    <div id="gameover-label">CAUGHT IN THE FALL</div>
    <div class="spidermark">🕷️</div>
    <h1 id="titleText">WEB RUNNER</h1>
    <p class="sub" id="subText">three threads. one spider. don't fall.</p>
    <div class="stat-row" id="statRow" style="display:none;">
      <div class="stat"><div class="n" id="finalScore">0</div><div class="l">SCORE</div></div>
      <div class="stat"><div class="n" id="finalFlies">0</div><div class="l">FLIES</div></div>
      <div class="stat"><div class="n" id="finalBest">0</div><div class="l">BEST</div></div>
    </div>
    <button id="startBtn">Start</button>
    <div id="controls-note">← → or A/D to switch threads · space / tap to start</div>
  </div>
 </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const LANES = 3;
  const laneX = i => (W / (LANES + 1)) * (i + 1);
  const spiderY = H - 120;

  let best = 0;
  let state = 'idle'; // idle | playing | dead
  let score = 0, flies = 0;
  let speed = 4.2;
  let elapsed = 0;
  let spawnTimer = 0;
  let spawnInterval = 62;

  const spider = { lane: 1, x: laneX(1), targetX: laneX(1), y: spiderY, legPhase: 0 };
  let obstacles = []; // {lane, y, w, type}
  let flyItems = [];  // {lane, y, bob}
  let webStrands = []; // background decoration
  let particles = [];

  function initWeb() {
    webStrands = [];
    for (let i = 0; i < 14; i++) {
      webStrands.push({
        y: Math.random() * H,
        speed: 0.3 + Math.random() * 0.5,
        alpha: 0.06 + Math.random() * 0.1
      });
    }
  }
  initWeb();

  function resetGame() {
    score = 0; flies = 0; speed = 4.2; elapsed = 0;
    spawnTimer = 0; spawnInterval = 62;
    spider.lane = 1; spider.x = laneX(1); spider.targetX = laneX(1);
    obstacles = []; flyItems = []; particles = [];
  }

  function moveLane(dir) {
    if (state !== 'playing') return;
    const newLane = Math.min(LANES - 1, Math.max(0, spider.lane + dir));
    if (newLane !== spider.lane) {
      spider.lane = newLane;
      spider.targetX = laneX(newLane);
      spawnParticleBurst(spider.x, spider.y, '#7cff6b');
    }
  }

  function spawnParticleBurst(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 20,
        color
      });
    }
  }

  function spawnRow() {
    // decide pattern: sometimes obstacle in 1-2 lanes, always leave a gap
    const blockedLanes = new Set();
    const numBlocked = Math.random() < 0.35 ? 2 : 1;
    while (blockedLanes.size < numBlocked) {
      blockedLanes.add(Math.floor(Math.random() * LANES));
    }
    // ensure at least one lane open
    if (blockedLanes.size >= LANES) blockedLanes.delete([...blockedLanes][0]);

    for (let l = 0; l < LANES; l++) {
      if (blockedLanes.has(l)) {
        obstacles.push({ lane: l, y: -30, w: 34, type: Math.random() < 0.5 ? 'leaf' : 'thorn' });
      } else if (Math.random() < 0.55) {
        flyItems.push({ lane: l, y: -30, bob: Math.random() * Math.PI * 2 });
      }
    }
  }

  function update() {
    if (state !== 'playing') return;

    elapsed++;
    score += 1;
    speed = 4.2 + Math.min(6, elapsed / 260);
    spawnInterval = Math.max(30, 62 - elapsed / 40);

    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnRow();
    }

    spider.x += (spider.targetX - spider.x) * 0.28;
    spider.legPhase += 0.35;

    for (const w of webStrands) {
      w.y += w.speed * (speed / 4.2);
      if (w.y > H) w.y = -20;
    }

    for (const o of obstacles) o.y += speed;
    for (const f of flyItems) { f.y += speed * 0.92; f.bob += 0.15; }

    obstacles = obstacles.filter(o => o.y < H + 40);
    flyItems = flyItems.filter(f => f.y < H + 40);

    // collision check
    for (const o of obstacles) {
      if (o.lane === spider.lane) {
        const dy = Math.abs(o.y - spider.y);
        if (dy < 26) {
          die();
          return;
        }
      }
    }
    for (let i = flyItems.length - 1; i >= 0; i--) {
      const f = flyItems[i];
      if (f.lane === spider.lane) {
        const dy = Math.abs(f.y - spider.y);
        if (dy < 26) {
          flies++;
          score += 25;
          spawnParticleBurst(spider.x, spider.y, '#ffb340');
          flyItems.splice(i, 1);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    document.getElementById('scoreVal').textContent = score;
  }

  function die() {
    state = 'dead';
    if (score > best) {
      best = score;
      document.getElementById('bestVal').textContent = best;
    }
    showOverlay(true);
  }

  function drawWeb() {
    ctx.save();
    ctx.strokeStyle = 'rgba(170,180,194,0.10)';
    ctx.lineWidth = 1;
    // vertical threads
    for (let i = 0; i < LANES; i++) {
      const x = laneX(i);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    // horizontal rungs, scrolling
    for (const w of webStrands) {
      ctx.beginPath();
      ctx.globalAlpha = w.alpha;
      ctx.moveTo(laneX(0) - 30, w.y);
      ctx.lineTo(laneX(LANES - 1) + 30, w.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawSpider() {
    const x = spider.x, y = spider.y;
    ctx.save();
    ctx.translate(x, y);

    // glow
    ctx.shadowColor = '#7cff6b';
    ctx.shadowBlur = 14;

    // legs
    ctx.strokeStyle = '#9be89a';
    ctx.lineWidth = 2.2;
    const legSwing = Math.sin(spider.legPhase) * 5;
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 3; i++) {
        const spread = 6 + i * 5;
        const swing = legSwing * (i % 2 === 0 ? 1 : -1);
        ctx.beginPath();
        ctx.moveTo(0, -4 + i * 3);
        ctx.lineTo(side * (spread + swing), 10 + i * 4);
        ctx.stroke();
      }
    }

    // body
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#7cff6b';
    ctx.beginPath();
    ctx.ellipse(0, 2, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5fe85a';
    ctx.beginPath();
    ctx.ellipse(0, -9, 6, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0d12';
    ctx.beginPath();
    ctx.arc(-2.4, -10, 1.3, 0, Math.PI * 2);
    ctx.arc(2.4, -10, 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawObstacle(o) {
    const x = laneX(o.lane), y = o.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ff4d5e';
    ctx.shadowBlur = 10;
    if (o.type === 'leaf') {
      ctx.fillStyle = '#e0525f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 9, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ff9aa2';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-8, -8); ctx.lineTo(8, 8);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ff4d5e';
      for (let i = 0; i < 5; i++) {
        const ang = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * 13, Math.sin(ang) * 13);
        ctx.lineTo(Math.cos(ang + 0.3) * 5, Math.sin(ang + 0.3) * 5);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFly(f) {
    const x = laneX(f.lane), y = f.y + Math.sin(f.bob) * 3;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = '#ffb340';
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,179,64,0.35)';
    ctx.beginPath();
    ctx.ellipse(-6, 0, 6, 3, 0.3, 0, Math.PI * 2);
    ctx.ellipse(6, 0, 6, 3, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffb340';
    ctx.beginPath();
    ctx.ellipse(0, 0, 4.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 20);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawWeb();
    for (const o of obstacles) drawObstacle(o);
    for (const f of flyItems) drawFly(f);
    drawParticles();
    if (state !== 'dead') drawSpider();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // --- overlay / state control ---
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const titleText = document.getElementById('titleText');
  const subText = document.getElementById('subText');
  const goLabel = document.getElementById('gameover-label');
  const statRow = document.getElementById('statRow');

  function showOverlay(isDead) {
    overlay.classList.remove('hidden');
    if (isDead) {
      goLabel.style.display = 'block';
      titleText.textContent = 'WEB SNAPPED';
      subText.textContent = 'the thread gave out.';
      statRow.style.display = 'flex';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalFlies').textContent = flies;
      document.getElementById('finalBest').textContent = best;
      startBtn.textContent = 'Retry';
    } else {
      goLabel.style.display = 'none';
      titleText.textContent = 'WEB RUNNER';
      subText.textContent = 'three threads. one spider. don\'t fall.';
      statRow.style.display = 'none';
      startBtn.textContent = 'Start';
    }
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function startGame() {
    resetGame();
    state = 'playing';
    hideOverlay();
  }

  startBtn.addEventListener('click', startGame);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
    if (e.code === 'Space' && state !== 'playing') startGame();
  });

  canvas.addEventListener('click', (e) => {
    if (state !== 'playing') { startGame(); return; }
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (W / rect.width);
    if (cx < W / 2) moveLane(-1); else moveLane(1);
  });

  let touchStartX = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (state !== 'playing') { startGame(); return; }
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 20) {
      moveLane(dx > 0 ? 1 : -1);
    } else {
      const rect = canvas.getBoundingClientRect();
      const cx = touchStartX - rect.left;
      moveLane(cx < rect.width / 2 ? -1 : 1);
    }
    touchStartX = null;
  });

  showOverlay(false);
  loop();
})();
</script>
</body>
</html>
